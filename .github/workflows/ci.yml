name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# 注意：本文件所有 run: 块里**只能出现 ASCII 字符**。
# GitHub Actions 会把 run: 内容写成不带 BOM 的 .ps1，而 Windows PowerShell 5.1
# 对无 BOM 的 UTF-8 会按 ANSI/GBK 解码 —— 中文会变乱码并直接语法报错。
# 所以带中文的逻辑一律放进 tools\*.ps1（那些文件是带 BOM 的），这里只留英文调用。
# tests\run-tests.ps1 里有一条测试专门防这个坑。

jobs:
  test:
    name: test (with PDF engine)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show environment
        shell: powershell
        run: |
          $PSVersionTable | Out-String | Write-Host
          [Environment]::OSVersion.VersionString | Write-Host

      - name: Guard - no private files or big binaries tracked
        shell: powershell
        run: |
          & .\tools\ci-check-tracked.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install PSScriptAnalyzer
        shell: powershell
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted -ErrorAction SilentlyContinue
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser -ErrorAction Stop

      - name: Static analysis (PSScriptAnalyzer)
        shell: powershell
        run: |
          $settings = Join-Path $PWD 'tools\PSScriptAnalyzerSettings.psd1'
          $results = Invoke-ScriptAnalyzer -Path '.\server.ps1' -Settings $settings
          if ($results) {
            $results | Format-Table RuleName, Severity, Line, Message -AutoSize -Wrap | Out-String | Write-Host
          } else {
            Write-Host 'PSScriptAnalyzer: 0 issues'
          }
          $errors = @($results | Where-Object { $_.Severity -eq 'Error' })
          if ($errors.Count -gt 0) {
            Write-Host ("PSScriptAnalyzer found " + $errors.Count + " error(s)") -ForegroundColor Red
            exit 1
          }

      - name: Fetch PDF engine (also validates pinned URL and SHA-256)
        shell: powershell
        run: |
          & .\tools\ci-fetch-engine.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run test suite
        shell: powershell
        run: |
          & .\tests\run-tests.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  # 用户从源码 clone 下来时是没有引擎的（仓库刻意不放 15MB 二进制），
  # 所以"缺引擎"这条路径也必须测到，不能只测顺风场景。
  test-without-engine:
    name: test (no PDF engine)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assert the repo really ships no engine
        shell: powershell
        run: |
          if (Test-Path '.\bin\SumatraPDF.exe') { throw 'repo must not contain bin\SumatraPDF.exe' }
          Write-Host '[OK] repo contains no PDF engine binary'

      - name: Run test suite (deliberately no engine)
        shell: powershell
        run: |
          & .\tests\run-tests.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
