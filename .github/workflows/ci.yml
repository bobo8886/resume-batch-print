name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: 测试 (Windows PowerShell 5.1)
    runs-on: windows-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 环境信息
        shell: powershell
        run: |
          $PSVersionTable | Out-String | Write-Host
          [Environment]::OSVersion.VersionString | Write-Host

      - name: 检查有没有误提交隐私文件 / 大二进制
        shell: powershell
        run: |
          # 看的是"仓库里跟踪了什么"，而不是工作区有什么
          $tracked = @(git ls-files)
          $bad = @()
          foreach ($p in @('config.json', '打印记录/printed.json', 'bin/SumatraPDF.exe', 'bin/SumatraPDF-settings.txt')) {
            if ($tracked -contains $p) { $bad += $p }
          }
          if ($bad.Count -gt 0) {
            Write-Host ("以下文件不该出现在仓库里: " + ($bad -join ', ')) -ForegroundColor Red
            exit 1
          }
          Write-Host ("✔ 仓库跟踪 " + $tracked.Count + " 个文件，没有隐私文件或大二进制")

      - name: 安装 PSScriptAnalyzer
        shell: powershell
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted -ErrorAction SilentlyContinue
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser -ErrorAction Stop

      - name: 静态分析 (PSScriptAnalyzer)
        shell: powershell
        run: |
          $settings = Join-Path $PWD 'tools\PSScriptAnalyzerSettings.psd1'
          $results = Invoke-ScriptAnalyzer -Path '.\server.ps1' -Settings $settings
          if ($results) {
            $results | Format-Table RuleName, Severity, Line, Message -AutoSize -Wrap | Out-String | Write-Host
          } else {
            Write-Host 'PSScriptAnalyzer: 0 条问题'
          }
          $errors = @($results | Where-Object { $_.Severity -eq 'Error' })
          if ($errors.Count -gt 0) {
            Write-Host ("发现 " + $errors.Count + " 个 Error 级问题") -ForegroundColor Red
            exit 1
          }

      - name: 准备 PDF 引擎（顺带验证固定 URL 与 SHA-256 确实有效）
        shell: powershell
        run: |
          $src  = Get-Content .\server.ps1 -Raw
          $url  = [regex]::Match($src, "\`$script:EngineUrl\s*=\s*'([^']+)'").Groups[1].Value
          $hash = [regex]::Match($src, "\`$script:EngineSha256\s*=\s*'([0-9A-Fa-f]{64})'").Groups[1].Value
          if (-not $url -or -not $hash) { throw '没能从 server.ps1 里解析出引擎 URL / SHA-256' }
          Write-Host "URL : $url"
          Write-Host "SHA : $hash"

          $tmp = Join-Path $env:RUNNER_TEMP 'engine'
          New-Item -ItemType Directory -Path $tmp -Force | Out-Null
          $zip = Join-Path $tmp 'engine.zip'
          [Net.ServicePointManager]::SecurityProtocol = [Net.ServicePointManager]::SecurityProtocol -bor [Net.SecurityProtocolType]::Tls12
          Invoke-WebRequest -Uri $url -OutFile $zip -UseBasicParsing -TimeoutSec 300
          Expand-Archive -LiteralPath $zip -DestinationPath $tmp -Force
          $exe = Get-ChildItem $tmp -Filter '*.exe' -Recurse | Select-Object -First 1
          if (-not $exe) { throw '下载包里没有可执行文件' }

          $actual = (Get-FileHash -LiteralPath $exe.FullName -Algorithm SHA256).Hash
          if ($actual -ne $hash) { throw "引擎哈希不匹配！期望 $hash，实际 $actual" }
          Write-Host '✔ 引擎下载成功，SHA-256 校验通过'

          New-Item -ItemType Directory -Path .\bin -Force | Out-Null
          Copy-Item -LiteralPath $exe.FullName -Destination .\bin\SumatraPDF.exe -Force

      - name: 运行测试套件
        shell: powershell
        run: |
          & .\tests\run-tests.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  # 用户从源码 clone 下来时是没有引擎的（仓库刻意不放 15MB 二进制），
  # 所以"缺引擎"这条路径也必须测到，不能只测顺风场景。
  test-without-engine:
    name: 测试 (无 PDF 引擎场景)
    runs-on: windows-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 确认仓库里确实没有引擎
        shell: powershell
        run: |
          if (Test-Path '.\bin\SumatraPDF.exe') { throw '仓库里不该有 bin\SumatraPDF.exe' }
          Write-Host '✔ 确认仓库不含 PDF 引擎'

      - name: 运行测试套件（故意不准备引擎）
        shell: powershell
        run: |
          & .\tests\run-tests.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
